[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  # Node 26 is an active LTS line and meets Astro's floor (>= 22.23.4).
  NODE_VERSION = "26"
  PNPM_VERSION = "10.33.0"

# Security headers for every response.
# The site has no inline styles and no inline scripts (the JSON-LD block is data, not script),
# so 'self' is enough for every resource type.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Astro puts a content hash in every file name under /_astro/, so these files can be cached for a long time.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
